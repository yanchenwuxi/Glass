plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

android {
    namespace 'com.glassbox.app'
    compileSdk 35

    defaultConfig {
        // 融合版独立 applicationId，可与旧 GlassBox / TVBox 并存安装
        applicationId "com.glassbox.unified"
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName "2.0.0-alpha5.1"

        ndk {
            abiFilters "arm64-v8a"
        }
        // Python 路径按本机环境配置；Linux/CI 可改为 python3 或删除由插件探测
        python {
            // buildPython "python3"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.navigation:navigation-compose:2.8.3'

    implementation 'dev.jdtech.mpv:libmpv:0.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // 画面调节：ExoPlayer.setVideoEffects 的 GL 效果（RgbAdjustment / Contrast / HslAdjustment）
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    // IJK 内核：blankyn 维护版 0.0.16（FFmpeg 含 OpenSSL，支持 HTTPS/HLS，2024 构建）
    implementation 'io.github.blankyn:ijkplayer-java:0.0.16'
    implementation 'io.github.blankyn:ijkplayer-ex_so:0.0.16'

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // drpy 规则源需要 pdfh/pdfa 之类 DOM 选择能力，QuickJS 侧无法离线跑 cheerio
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // 液态玻璃：真实背景模糊（Android 12+ 走 RenderEffect，低版本回退为着色）
    implementation 'dev.chrisbanes.haze:haze:1.2.2'

    // —— 融合自 TVBox：局域网推送 / 远程控制（P1 启用）——
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // Room：历史 / 收藏（对齐 TVBox VodRecord / VodCollect）
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
}

